<!doctype html>
<!-- Обложка репозитория 1280×640 для GitHub → Settings → Social preview.
     Рендер: откройте в браузере с окном 1280×640 и сохраните скриншот в docs/social-preview.png -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f4f6; --surface:#fff; --line:#e7e6ea; --ink:#16151a; --ink-2:#55535c; --ink-3:#8c8a93; --s1:#2a78d6; --good:#13824a; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--ink); display: flex; align-items: center; padding: 0 80px; gap: 64px; overflow: hidden; }
  .left { flex: 1; }
  .mark { font: 800 88px/1 Manrope, sans-serif; letter-spacing: -0.03em; }
  .mark span { color: var(--s1); }
  .tag { margin-top: 24px; font: 500 30px/1.3 Manrope, sans-serif; color: var(--ink-2); max-width: 560px; }
  .nets { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 560px; }
  .nets b { font: 500 18px Inter, sans-serif; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; }
  .card { width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 32px; box-shadow: 0 20px 60px rgba(22,21,26,.08); }
  .step { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border: 0; }
  .step .k { font-size: 18px; color: var(--ink-2); }
  .step .v { font: 700 30px Manrope, sans-serif; font-variant-numeric: tabular-nums; }
  .step .d { font-size: 15px; color: var(--good); margin-left: 10px; font-weight: 600; }
  .bar { height: 10px; border-radius: 6px; background: var(--s1); margin-top: 8px; }
  .cap { font-size: 14px; color: var(--ink-3); margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="left">
    <div class="mark">Даш<span>крафт</span></div>
    <p class="tag">SMM-дашборд по данным Livedune: воронка, динамика и посты по всем вашим соцсетям</p>
    <div class="nets"><b>Instagram</b><b>Telegram</b><b>ВКонтакте</b><b>YouTube</b><b>TikTok</b><b>Дзен</b><b>Одноклассники</b><b>Rutube</b><b>и другие</b></div>
  </div>
  <div class="card">
    <div class="cap">Воронка за 30 дней · демо-данные</div>
    <div class="step"><span class="k">Подписчики</span><span><span class="v">24 701</span><span class="d">+80</span></span></div>
    <div class="bar" style="width:100%"></div>
    <div class="step"><span class="k">Просмотры</span><span class="v">333 тыс.</span></div>
    <div class="bar" style="width:78%"></div>
    <div class="step"><span class="k">Охват</span><span class="v">267 тыс.</span></div>
    <div class="bar" style="width:62%"></div>
    <div class="step"><span class="k">Реакции</span><span class="v">24 488</span></div>
    <div class="bar" style="width:30%"></div>
    <div class="step"><span class="k">ER</span><span><span class="v">3,97%</span><span class="d">+0,14 п.п.</span></span></div>
  </div>
</body>
</html>
